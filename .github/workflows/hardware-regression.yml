name: hardware-regression

on:
  pull_request:
  push:
    branches:
      - main
      - compiler/target-contract-v2
      - compiler/kernel-abi-v0
      - compiler/llvm-frontend-v0
      - compiler/loop-recurrence-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: hardware-change-detection
    runs-on: ubuntu-24.04
    outputs:
      run_hardware: ${{ steps.detect.outputs.run_hardware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect backend-affecting changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "run_hardware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "run_hardware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(compiler/|rtl/|tb/|sim/|model/|tools/|target/|examples/schedules/|tests/|Makefile$|synth/rtl_files\.f$|\.github/workflows/hardware-regression\.yml$)'
          if git diff --name-only "$base" "$head" | grep -E "$paths" >/dev/null; then
            echo "run_hardware=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_hardware=false" >> "$GITHUB_OUTPUT"
          fi

  regression:
    name: hardware-backend-regression
    needs: changes
    if: needs.changes.outputs.run_hardware == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install backend dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-14 llvm-14 llvm-14-dev llvm-14-tools g++ make nlohmann-json3-dev python3 python3-pytest verilator
      - name: Lint top-level RTL
        run: make lint TEST=cgra_top_tb
      - name: RTL regression
        run: make regression
      - name: Shared scratchpad negative tests
        run: make shared-scratchpad-negative-tests
      - name: Retained shared-memory program
        run: make program PROGRAM_MANIFEST=examples/schedules/shared_memory_cross_lsu_4x4.json
      - name: Modulo-loop regression
        run: make modulo-loop
      - name: Compiler-generated program E2E
        run: make compiler-e2e
      - name: Kernel ABI V0 E2E
        run: make kernel-abi-e2e
      - name: LLVM frontend V0 E2E
        run: make llvm-frontend-e2e
      - name: LLVM recurrence V0 E2E
        run: make llvm-recurrence-e2e
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-regression-failures
          if-no-files-found: ignore
          path: |
            build/program/**/program_manifest.json
            build/program/**/config_stream.json
            build/program/**/golden_trace.csv
            build/program/**/rtl_trace.csv
            build/program/**/rtl_simulation.log
            build/program/**/compare.log
            build/modulo_loop/*.json
            build/modulo_loop/*.csv
            build/modulo_loop/*.log
            build/modulo_loop/*/*.csv
            build/modulo_loop/*/*.log
            build/*/trace.csv
            build/compiler-e2e/**
            build/kernel-e2e/**

  hardware-regression-gate:
    name: hardware-regression-gate
    if: always()
    needs: [changes, regression]
    runs-on: ubuntu-24.04
    steps:
      - name: Accept clean skips or require regression success
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != success ]]; then
            echo "Change detection failed."
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run_hardware }}" == true && \
                "${{ needs.regression.result }}" != success ]]; then
            echo "Hardware regression failed or was cancelled."
            exit 1
          fi
