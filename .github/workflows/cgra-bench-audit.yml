name: cgra-bench-audit

on:
  push:
    branches:
      - compiler/cgra-bench-audit-v0
      - compiler/linear-multiblock-loop-v0
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  full-audit:
    name: cgra-bench-full-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install audit dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-14 llvm-14 llvm-14-dev llvm-14-tools cmake g++-multilib libc6-dev-i386 nlohmann-json3-dev python3 jq
      - name: Verify pinned clean corpus
        run: |
          set -euo pipefail
          test "$(git -C third_party/CGRA-Bench rev-parse HEAD)" = "$(jq -r .commit benchmarks/cgra-bench/corpus.lock.json)"
          test -z "$(git -C third_party/CGRA-Bench status --porcelain)"
      - name: Run complete audit
        run: make cgra-bench-audit
      - name: Verify audit reconciliation contract
        run: |
          set -euo pipefail
          summary=build/cgra-bench/run/full/summary.json
          test -s build/cgra-bench/run/full/results.jsonl
          jq -e '
            .reconciliation.ok == true and
            .unknown_count == 0 and
            .timeout_count == 0
          ' "$summary" >/dev/null
      - name: Verify T020 mapping outcome gate
        run: |
          set -euo pipefail
          summary=build/cgra-bench/run/full/summary.json
          jq -e '
            .linear_multiblock.shape_rejection_count == 0 and
            .t020_outcome.frontend_dfg_or_higher >= 10 and
            .t020_outcome.mapped_or_higher >= 8 and
            .t020_outcome.mapped_kernel_directories >= 5 and
            .t020_outcome.pass == true
          ' "$summary" >/dev/null
      - name: Upload complete audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgra-bench-full-audit
          if-no-files-found: error
          path: build/cgra-bench/run/full/**
